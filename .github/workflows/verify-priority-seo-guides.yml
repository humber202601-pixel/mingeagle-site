name: Verify priority B2B guide SEO
on:
  pull_request:
    branches: ["main"]
    paths:
      - "public/basketball-camp-equipment-supplier.html"
      - "public/quiet-indoor-sports-for-kids.html"
      - "public/indoor-school-sports-equipment-guide.html"
      - "public/silent-basketball-bulk-buying-guide.html"
      - "public/school-basketball-bulk-order-rfq-checklist.html"
      - "public/inquiry.html"
      - "public/silent-basketball.html"
      - "public/fabric-silent-basketball.html"
      - "public/weighted-flocked-basketball.html"
      - "public/silent-soccer.html"
      - "public/silent-basketball-guide.html"
      - "public/sitemap.xml"
      - "public/llms.txt"
      - "public/index.html"
      - "scripts/ensure-bing-webmaster-verification.cjs"
      - "scripts/check-priority-seo-guides.cjs"
      - "scripts/build-first-touch-crawl-coverage.cjs"
      - "scripts/check-first-touch-crawl-coverage.cjs"
      - "scripts/check-acoustics-citations.cjs"
      - "scripts/check-school-procurement-evidence.cjs"
      - "public/indoor-ball-sample-comparison-protocol.txt"
      - "public/indoor-ball-trial-blank.csv"
      - "scripts/check-open-trial-kit.cjs"
      - "scripts/check-public-canonicals.cjs"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/verify-priority-seo-guides.yml"
  push:
    branches: ["main"]
    paths:
      - "public/basketball-camp-equipment-supplier.html"
      - "public/quiet-indoor-sports-for-kids.html"
      - "public/indoor-school-sports-equipment-guide.html"
      - "public/silent-basketball-bulk-buying-guide.html"
      - "public/school-basketball-bulk-order-rfq-checklist.html"
      - "public/inquiry.html"
      - "public/silent-basketball.html"
      - "public/fabric-silent-basketball.html"
      - "public/weighted-flocked-basketball.html"
      - "public/silent-soccer.html"
      - "public/silent-basketball-guide.html"
      - "public/sitemap.xml"
      - "public/llms.txt"
      - "public/index.html"
      - "scripts/ensure-bing-webmaster-verification.cjs"
      - "scripts/check-priority-seo-guides.cjs"
      - "scripts/build-first-touch-crawl-coverage.cjs"
      - "scripts/check-first-touch-crawl-coverage.cjs"
      - "scripts/check-acoustics-citations.cjs"
      - "scripts/check-public-canonicals.cjs"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/verify-priority-seo-guides.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify acoustics source citations and evidence limits
        run: node scripts/check-acoustics-citations.cjs
      - name: Verify school procurement evidence and endorsement limits
        run: node scripts/check-school-procurement-evidence.cjs
      - name: Verify blank open trial kit and procurement links
        run: node scripts/check-open-trial-kit.cjs
      - name: Verify first-touch AI referral capture covers public buyer pages
        run: |
          node scripts/build-first-touch-crawl-coverage.cjs
          node scripts/check-first-touch-crawl-coverage.cjs
          node scripts/build-first-touch-crawl-coverage.cjs --check
      - name: Verify Bing site-ownership tag on canonical homepage
        run: |
          node scripts/ensure-bing-webmaster-verification.cjs --check
          node scripts/ensure-bing-webmaster-verification.cjs
          node scripts/ensure-bing-webmaster-verification.cjs --check
      - name: Verify buyer guide snippets and image schema
        run: node scripts/check-priority-seo-guides.cjs
      - name: Verify canonical and sitemap integrity
        run: node scripts/check-public-canonicals.cjs
