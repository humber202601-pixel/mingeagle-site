name: Verify quote UI on desktop and mobile
on:
  pull_request:
    branches: [v2-cloudflare]
  push:
    branches: [v2-cloudflare]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:quote-ui
      - name: Preserve real browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-quote-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
