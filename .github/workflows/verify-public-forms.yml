name: Verify public form / CRM bridge
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/verify-live-wholesale-csv.mjs'
      - 'scripts/verify-live-supplier-introduction.mjs'
      - 'scripts/check-live-asset-workflow.cjs'
      - '.github/workflows/verify-published-wholesale-csv.yml'
      - 'scripts/build-wholesale-product-facts-csv.cjs'
      - 'scripts/check-wholesale-product-facts-csv.cjs'
      - 'scripts/check-b2b-acquisition-resource.cjs'
      - 'scripts/check-procurement-ai-buyer-answers.cjs'
      - 'scripts/build-ai-school-logo-buyer-answers.cjs'
      - 'scripts/check-ai-school-logo-buyer-answers.cjs'
      - 'admin/learning-copy.json'
      - 'scripts/enable-web-analytics.cjs'
      - 'scripts/check-web-analytics.cjs'
      - 'scripts/enable-ga4-consent.cjs'
      - 'scripts/check-ga4-consent.cjs'
      - 'scripts/test-ga4-consent-flow.cjs'
      - 'public/ga4-consent.js'
      - 'public/ga4-consent.css'
      - 'scripts/check-custom-logo.cjs'
      - 'public/inquiry.js'
      - 'public/sales-assistant.js'
      - 'public/sales-assistant-i18n.js'
      - 'scripts/check-chat-i18n.cjs'
      - 'public/turnstile-client.js'
      - 'public/forms-core.js'
      - 'public/inquiry-config.js'
      - 'scripts/check-crm-bridge.cjs'
      - 'scripts/check-forms-core.cjs'
      - 'scripts/check-turnstile.cjs'
      - 'scripts/check-conversion.cjs'
      - 'scripts/check-growth.cjs'
      - 'scripts/build-conversion.py'
      - 'scripts/build-seo-v37.cjs'
      - 'scripts/build-us-delivered-prices.cjs'
      - 'scripts/test-us-delivered-prices.cjs'
      - 'scripts/check-seo-v37.cjs'
      - 'scripts/check-retail-quantity-routing.cjs'
      - 'scripts/test-product-cart-journey.cjs'
      - 'scripts/build-free-exposure-resources.cjs'
      - 'scripts/test-free-exposure-resources.cjs'
      - 'scripts/build-product-buyer-answers.cjs'
      - 'scripts/test-product-buyer-answers.cjs'
      - 'scripts/build-creator-to-product.cjs'
      - 'scripts/test-creator-to-product.cjs'
      - 'scripts/check-priority-indexing-pages.cjs'
      - 'scripts/test-school-buyer-rfq.cjs'
      - 'public/videos.html'
      - 'public/products.html'
      - 'public/fabric-silent-basketball.html'
      - 'scripts/build-search-buyer-paths.cjs'
      - 'scripts/test-search-buyer-paths.cjs'
      - 'scripts/test-creator-build-cache.cjs'
      - 'scripts/build-conversion.py'
      - 'public/retail-buy.js'
      - 'public/forms-core.js'
      - 'public/inquiry.js'
      - 'scripts/build-b2b-quote-planner.cjs'
      - 'scripts/test-b2b-quote-planner.cjs'
      - 'public/b2b-quote-planner.js'
      - 'public/b2b-quote-planner.css'
      - 'public/retail-buy.js'
      - 'public/retail-buy.css'
      - 'public/retail-cart.js'
      - 'public/inquiry.js'
      - 'public/retail-cart.html'
      - 'public/sales-quantity-policy.json'
      - 'scripts/build-seo-discovery-links.cjs'
      - 'scripts/build-product-listing-discovery.cjs'
      - 'scripts/check-product-listing-discovery.cjs'
      - 'scripts/check-ai-intent-guides.cjs'
      - 'scripts/check-ai-discovery-benchmark.cjs'
      - 'data/ai-discovery-benchmark.json'
      - 'scripts/check-localized-school-guides.cjs'
      - 'scripts/test-localized-school-guides.cjs'
      - 'scripts/check-coach-ai-answers.cjs'
      - 'scripts/check-public-crawl-graph.cjs'
      - 'scripts/check-live-public-crawl.py'
      - 'scripts/check-school-product-crawl-paths.cjs'
      - 'scripts/build-school-sample-evaluation.cjs'
      - 'scripts/check-shareable-b2b-resources.cjs'
      - 'scripts/check-wholesale-supplier-introduction.cjs'
      - 'scripts/check-b2b-sharing-preview.cjs'
      - 'scripts/check-wholesale-product-deep-links.cjs'
      - 'scripts/check-public-canonicals.cjs'
      - 'scripts/check-sitemap-lastmod-evidence.cjs'
      - 'scripts/test-b2b-outreach-pages.cjs'
      - 'docs/marketing/us-b2b-prospecting-sprint-2026-10-17.md'
      - 'scripts/test-public-canonicals.cjs'
      - 'scripts/build-ai-product-facts.cjs'
      - 'scripts/check-ai-product-facts.cjs'
      - 'scripts/check-geo-source-capture.cjs'
      - 'scripts/check-seo-discovery-links.cjs'
      - 'scripts/optimize-native-media.cjs'
      - 'scripts/check-native-media.cjs'
      - 'scripts/check-locale-completeness.cjs'
      - 'scripts/build-product-direct-rfq.cjs'
      - 'scripts/check-product-direct-rfq.cjs'
      - 'scripts/indexnow-notify-changed.cjs'
      - 'scripts/test-indexnow-notify-changed.cjs'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/verify-public-forms.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-form-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize canonical hostname for public tests
        run: python scripts/normalize-canonical-host.py
      - name: Normalize built public form scripts
        run: python scripts/normalize-contact-helper.py
      - name: Ensure analytics tags and privacy disclosure are packaged
        run: |
          node scripts/enable-web-analytics.cjs
          node scripts/check-web-analytics.cjs
          node scripts/enable-web-analytics.cjs --check

      - name: Ensure consent-based GA4 tracking is packaged safely
        run: |
          node scripts/enable-ga4-consent.cjs
          node scripts/check-ga4-consent.cjs
          node scripts/test-ga4-consent-flow.cjs
          node scripts/enable-ga4-consent.cjs --check

      - name: Check public inquiry / CRM mapping and site attribution
        run: |
          node scripts/check-growth.cjs
          node scripts/check-conversion.cjs
          node scripts/check-crm-bridge.cjs
          node scripts/check-forms-core.cjs
          node scripts/check-turnstile.cjs
          node scripts/check-seo-v37.cjs
          node scripts/check-retail-quantity-routing.cjs
          node scripts/test-product-cart-journey.cjs
          node scripts/test-b2b-quote-planner.cjs
          node scripts/check-catalog-inquiry.cjs
          node scripts/check-inquiry.cjs
          node --check scripts/build-us-delivered-prices.cjs
          node scripts/test-us-delivered-prices.cjs
          node scripts/test-product-buyer-answers.cjs
          node scripts/build-free-exposure-resources.cjs
          node scripts/test-free-exposure-resources.cjs
          node scripts/build-ai-school-logo-buyer-answers.cjs
          node scripts/check-ai-school-logo-buyer-answers.cjs
          node scripts/test-creator-to-product.cjs
          node scripts/check-priority-indexing-pages.cjs
          node scripts/test-school-buyer-rfq.cjs
          node scripts/test-search-buyer-paths.cjs
          node scripts/test-creator-build-cache.cjs
          node scripts/build-seo-discovery-links.cjs
          node scripts/build-product-listing-discovery.cjs
          node scripts/check-product-listing-discovery.cjs
          node scripts/check-seo-discovery-links.cjs
          node scripts/check-ai-intent-guides.cjs
          node scripts/check-ai-discovery-benchmark.cjs
          node scripts/check-localized-school-guides.cjs
          node scripts/test-localized-school-guides.cjs
          node scripts/check-coach-ai-answers.cjs
          node scripts/check-public-crawl-graph.cjs
          python scripts/check-live-public-crawl.py --self-test
          node scripts/check-school-product-crawl-paths.cjs
          node scripts/build-school-sample-evaluation.cjs --check
          node scripts/check-shareable-b2b-resources.cjs
          node scripts/check-wholesale-supplier-introduction.cjs
          node scripts/check-b2b-sharing-preview.cjs
          node scripts/check-wholesale-product-deep-links.cjs
          node scripts/check-public-canonicals.cjs
          node scripts/check-sitemap-lastmod-evidence.cjs
          node scripts/check-b2b-acquisition-resource.cjs
          node scripts/check-procurement-ai-buyer-answers.cjs
          node scripts/test-b2b-outreach-pages.cjs
          node scripts/test-indexnow-notify-changed.cjs
          node scripts/test-public-canonicals.cjs
          node scripts/build-ai-product-facts.cjs
          node scripts/check-ai-product-facts.cjs
          node scripts/build-ai-product-facts.cjs --check
          node scripts/verify-live-wholesale-csv.mjs --self-test
          node scripts/verify-live-supplier-introduction.mjs --self-test
          node scripts/check-live-asset-workflow.cjs
          node scripts/check-wholesale-product-facts-csv.cjs
          node scripts/check-geo-source-capture.cjs
          node scripts/check-native-media.cjs
          node --check public/sales-assistant.js
          node scripts/check-chat-i18n.cjs
          node scripts/check-locale-completeness.cjs
          node scripts/check-custom-logo.cjs
          node scripts/check-product-direct-rfq.cjs
