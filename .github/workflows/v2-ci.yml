name: Validate MING EAGLE V2

on:
  push:
    branches: ["v2-cloudflare", "discovery-v13-*", "discovery-v14-*"]
  pull_request:
    branches: ["main", "v2-cloudflare"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test discovery and CRM integration
        run: npm run test:discovery

      - name: Bundle Cloudflare Functions
        run: npx wrangler pages functions build --outdir /tmp/mingeagle-functions
