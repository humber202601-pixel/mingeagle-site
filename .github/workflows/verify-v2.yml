name: Verify Cloudflare CRM changes

on:
  pull_request:
    branches: [v2-cloudflare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Checkout canonical website references
        uses: actions/checkout@v4
        with:
          ref: main
          path: canonical-website
          sparse-checkout: public
      - name: Verify prices and calculator match website main
        run: node scripts/sync-quote-reference.mjs --check --from canonical-website/public
      - name: Verify quote arithmetic and isolated CRM workflow
        run: npm run test:quotes
      - name: Run discovery, authentication, and CRM regression tests
        run: npm run test:discovery
      - name: Typecheck and build
        run: npm run build
      - name: Compile Cloudflare scheduled Worker without publishing
        run: npx wrangler deploy --config wrangler.scheduler.toml --dry-run --outdir /tmp/mingeagle-scheduler-build
