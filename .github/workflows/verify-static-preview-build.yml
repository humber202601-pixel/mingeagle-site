name: Verify static Cloudflare Preview build

on:
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "scripts/build-cloudflare-static-preview.cjs"
      - ".github/workflows/verify-static-preview-build.yml"

permissions:
  contents: read

jobs:
  verify-static-preview-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site for Cloudflare Pages
        run: npm run build

      - name: Verify required preview output
        run: |
          test -s dist/index.html
          test -s dist/for-schools.html
          test -s dist/silent-basketball-for-apartments.html
          test -s dist/custom-basketball-for-teams.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
