name: Deploy MING EAGLE website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact V15 current-site candidate
        run: |
          mkdir -p public
          curl -fL "https://ming-eagle-sports.floot.app/_cdn/static/mingeagle-v15-current-site-bridge.zip" -o site.zip
          unzip -q site.zip -d public
          echo "www.mingeagle.com" > public/CNAME

      - name: Apply V19 product education and responsive fixes
        run: |
          python site-overrides/patch_site.py public

      - name: Apply V20 creator-video and visual highlight polish
        run: |
          python site-overrides/v20_polish.py public

      - name: Apply V21 reliable product videos and premium selling-point visuals
        run: |
          cat site-overrides/v20_product.css >> public/styles.css
          python site-overrides/v20_fix_product_pages.py public

      - name: Release guard — preserve products, TikTok wall, guide and V21 polish
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('public/index.html').read_text(encoding='utf-8')
          videos = Path('public/videos.html').read_text(encoding='utf-8')
          inquiry = Path('public/inquiry.html').read_text(encoding='utf-8')
          products_page = Path('public/products.html').read_text(encoding='utf-8')
          guide = Path('public/silent-basketball-guide.html').read_text(encoding='utf-8')
          styles = Path('public/styles.css').read_text(encoding='utf-8')

          home_players = index.count('tiktok.com/player')
          wall_players = videos.count('tiktok.com/player')
          if home_players < 6:
              raise SystemExit(f'Homepage TikTok regression: expected at least 6 players, found {home_players}.')
          if wall_players < 16:
              raise SystemExit(f'Video Wall regression: expected at least 16 players, found {wall_players}.')

          forbidden = [
              'Basketball Uniform', 'Soccer Uniform', 'Training Shirt',
              'Team Socks', 'Shin Guards', 'Team Packages', 'Custom Studio'
          ]
          combined = index + '\n' + videos + '\n' + inquiry + '\n' + products_page + '\n' + guide
          found = [term for term in forbidden if term.lower() in combined.lower()]
          if found:
              raise SystemExit('Out-of-scope product/content detected: ' + ', '.join(found))

          expected_bridge = 'https://ming-eagle-sports.floot.app/_api/inquiry'
          if expected_bridge not in inquiry:
              raise SystemExit('Published Floot inquiry bridge is missing.')

          required_products = [
              'Flocked Silent Basketball Set',
              'Fabric-Cover Silent Basketball Set',
              'Weighted Flocked Silent Basketball',
              'Flocked Silent Soccer Ball',
          ]
          missing = [p for p in required_products if p not in products_page]
          if missing:
              raise SystemExit('Current product regression: ' + ', '.join(missing))

          product_pages = [
              'silent-basketball.html', 'fabric-silent-basketball.html',
              'weighted-flocked-basketball.html', 'silent-soccer.html'
          ]
          for page in product_pages:
              text = Path('public', page).read_text(encoding='utf-8')
              if 'id="product-benefits"' not in text:
                  raise SystemExit(f'Product detail section missing: {page}')
              if 'id="real-product-highlights"' not in text or 'sellingPointGrid' not in text:
                  raise SystemExit(f'V21 visual selling-point section missing: {page}')

          first_product = Path('public/silent-basketball.html').read_text(encoding='utf-8')
          first_product_players = first_product.count('tiktok.com/player')
          if 'id="creator-videos"' not in first_product or 'creatorShowcase' not in first_product or first_product_players < 6:
              raise SystemExit(f'V21 reliable product creator-video section missing or incomplete: {first_product_players} players')

          if 'QUIETER PLAY, EXPLAINED.' not in guide or 'SET UP THE MINI HOOP THE RIGHT WAY.' not in guide:
              raise SystemExit('Silent basketball guide is incomplete.')
          if '@keyframes meTicker' not in styles or 'MING EAGLE V20 product highlights' not in styles:
              raise SystemExit('V21 product highlight CSS is missing.')

          print(f'V21 guard passed: homepage TikTok={home_players}, product TikTok={first_product_players}, Video Wall TikTok={wall_players}.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
