name: Deploy MING EAGLE website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download curated creator website payload
        run: |
          mkdir -p public
          curl -fL "https://ming-eagle-sports.floot.app/_cdn/static/03726ca3-c863-42dd-b662-898128fe23ea-mingeagle-v8-curated-creator.zip" -o site.zip
          unzip -q site.zip -d public
          echo "www.mingeagle.com" > public/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
