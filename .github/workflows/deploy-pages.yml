name: Deploy MING EAGLE self-contained website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply product images specifications and 2x2 layout
        run: python scripts/deploy-finalize.py

      - name: Build search guides
        run: python scripts/build-learning.py

      - name: Apply contact and crawl improvements
        run: python scripts/build-conversion.py

      - name: Build V37 search discovery metadata
        run: node scripts/build-seo-v37.cjs

      - name: Align canonical host and sitemap with live www redirect
        run: python scripts/normalize-canonical-host.py

      - name: Normalize contact helper across generated pages
        run: python scripts/normalize-contact-helper.py

      - name: Verify confirmation build
        run: |
          test -f public/index.html
          test -f public/products.html
          test -f public/product-master.json
          test -f public/product-grid-2x2.css
          test -f public/assets/hero-flocked-silent-basketball-set.webp
          test -f public/assets/hero-fabric-cover-silent-basketball-set.webp
          test -f public/assets/hero-weighted-flocked-silent-basketball.webp
          test -f public/assets/hero-flocked-silent-soccer-ball.webp
          grep -q "productGrid2" public/index.html
          grep -q "productGrid2" public/products.html
          grep -q "Orange / Blue / Green / Yellow" public/product-master.json
          grep -q "No. 3 / No. 4 / No. 6 / No. 7" public/product-master.json
          grep -q "Orange / Brown / Black / Aqua Blue" public/product-master.json
          grep -q "Black/Red" public/product-master.json
          grep -q "Yellow/Green" public/product-master.json
          if grep -RniE "floot\\.app|ming-eagle-sports\\.floot" public; then
            echo "Floot runtime dependency detected"
            exit 1
          fi

      - name: Verify inbound attribution and translations
        run: node scripts/check-growth.cjs && node scripts/check-learning.cjs && node scripts/check-marketing-kit.cjs && node scripts/check-conversion.cjs && node scripts/check-crm-bridge.cjs && node scripts/check-turnstile.cjs && node scripts/check-seo-v37.cjs && node scripts/check-catalog-inquiry.cjs

      - name: Verify shipping quote calculator
        run: node scripts/check-shipping.cjs

      - name: Verify retail-to-wholesale quote calculations
        run: node scripts/check-quote-math.cjs

      - name: Verify shared retail prices are packaged for deployment
        run: |
          test -s public/retail-reference-prices.json
          test -s public/quote-math.js
          node -e "const p=require('./public/retail-reference-prices.json'); if(p.currency!=='USD'||Object.keys(p.products||{}).length!==4)process.exit(1)"

      - name: Verify nine-language sales assistant before publishing
        run: |
          node --check public/sales-assistant.js
          node --check public/sales-assistant-i18n.js
          node scripts/check-chat-i18n.cjs

      - name: Stamp publicly verifiable deployment revision
        run: |
          printf '{"revision":"%s","builtAt":"%s","workflow":"github-pages"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deployment-version.json
          test -s public/deployment-version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm live site serves this exact revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://www.mingeagle.com/deployment-version.json'
          expected = os.environ['EXPECTED_REVISION']
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent':'MING-EAGLE-deploy-check/1.0'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      data = json.load(response)
                  if data.get('revision') == expected:
                      print('PASS: public website serves deployed revision', expected)
                      break
                  print('Still serving', data.get('revision'), 'expected', expected)
              except Exception as exc:
                  print('Waiting for live deployment:', str(exc))
              if attempt == 11:
                  raise SystemExit('FAIL: public site did not serve deployed revision')
              time.sleep(10)
          PY

      - name: Verify live pricing JSON and calculator HTTP responses
        run: |
          python - <<'PY'
          import json, urllib.request
          base = 'https://www.mingeagle.com/'
          for filename in ('retail-reference-prices.json', 'quote-math.js'):
              with urllib.request.urlopen(urllib.request.Request(base+filename,headers={'Accept':'application/json' if filename.endswith('.json') else '*/*','User-Agent':'MING-EAGLE-verify/1.0'}), timeout=20) as response:
                  body=response.read()
                  if response.status!=200 or not body:
                      raise SystemExit('FAIL '+filename+' status '+str(response.status))
                  print('PASS live resource', filename, 'bytes', len(body), 'type', response.headers.get('Content-Type'))
                  if filename.endswith('.json'):
                      data=json.loads(body)
                      assert data['currency']=='USD' and len(data['products'])==4
                  else:
                      assert b'calculateFromCatalog' in body
          PY
