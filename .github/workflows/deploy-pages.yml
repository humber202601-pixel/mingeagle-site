name: Deploy MING EAGLE self-contained website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply canonical product specifications
        run: python scripts/apply-product-specs.py

      - name: Verify self-contained production files
        run: |
          test -f public/index.html
          test -f public/product-master.json
          test -f public/assets/real-highlight-flocked-set.webp
          test -f public/assets/real-highlight-weighted-flocked.webp
          test -f public/assets/real-highlight-fabric-cover.webp
          test -f public/assets/real-highlight-soccer.webp
          test $(stat -c%s public/assets/real-highlight-flocked-set.webp) -gt 150000
          test $(stat -c%s public/assets/real-highlight-weighted-flocked.webp) -gt 150000
          test $(stat -c%s public/assets/real-highlight-fabric-cover.webp) -gt 150000
          test $(stat -c%s public/assets/real-highlight-soccer.webp) -gt 150000
          grep -q "Orange / Blue / Green / Yellow" public/product-master.json
          grep -q "No. 3 / No. 4 / No. 6 / No. 7" public/product-master.json
          grep -q "Orange / Brown / Black / Aqua Blue" public/product-master.json
          grep -q "Black/Red" public/product-master.json
          grep -q "Yellow/Green" public/product-master.json
          if grep -RniE "floot\.app|ming-eagle-sports\.floot" public; then
            echo "Floot runtime dependency detected"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
