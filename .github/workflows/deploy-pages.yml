name: Publish full-resolution REAL PRODUCT HIGHLIGHTS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch approved 1254px artwork once
        run: |
          mkdir -p public/assets
          curl -fL 'https://ming-eagle.floot.app/_cdn/static/c170c574-8300-47b6-94d0-24bde251e1a2-highlight-flocked-set-1254.webp' -o public/assets/real-highlight-flocked-set.webp
          curl -fL 'https://ming-eagle.floot.app/_cdn/static/470b2457-9cd4-4547-836d-aec83a10ef5a-highlight-weighted-flocked-1254.webp' -o public/assets/real-highlight-weighted-flocked.webp
          curl -fL 'https://ming-eagle.floot.app/_cdn/static/1b2d4432-fe34-409d-a624-51e2584fa95b-highlight-fabric-cover-1254.webp' -o public/assets/real-highlight-fabric-cover.webp
          curl -fL 'https://ming-eagle.floot.app/_cdn/static/bb8f0e0e-b076-407f-bcf4-65b3034234ae-highlight-soccer-1254.webp' -o public/assets/real-highlight-soccer.webp
          test $(stat -c%s public/assets/real-highlight-flocked-set.webp) -gt 150000
          test $(stat -c%s public/assets/real-highlight-weighted-flocked.webp) -gt 150000
          test $(stat -c%s public/assets/real-highlight-fabric-cover.webp) -gt 150000
          test $(stat -c%s public/assets/real-highlight-soccer.webp) -gt 150000

      - name: Verify pages use local highlight artwork
        run: |
          grep -q 'assets/real-highlight-flocked-set.webp' public/silent-basketball.html
          grep -q 'assets/real-highlight-weighted-flocked.webp' public/weighted-flocked-basketball.html
          grep -q 'assets/real-highlight-fabric-cover.webp' public/fabric-silent-basketball.html
          grep -q 'assets/real-highlight-soccer.webp' public/silent-soccer.html

      - name: Freeze full-resolution artwork into GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/real-highlight-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Freeze 1254px approved REAL PRODUCT HIGHLIGHTS artwork [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
