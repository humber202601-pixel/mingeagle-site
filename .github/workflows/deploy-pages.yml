name: Deploy MING EAGLE self-contained website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Compare the current main push to its previous revision

      - name: Apply product images specifications and 2x2 layout
        run: python scripts/deploy-finalize.py

      - name: Prevent stale inquiry JS after contact build normalization
        run: node scripts/test-creator-build-cache.cjs

      - name: Build search guides
        run: python scripts/build-learning.py

      - name: Apply contact and crawl improvements
        run: python scripts/build-conversion.py

      - name: Build V37 search discovery metadata
        run: node scripts/build-seo-v37.cjs

      - name: Publish verified US one-item delivery price and 12–15-day estimated air parcel
        run: |
          node scripts/build-us-delivered-prices.cjs
          node scripts/test-us-delivered-prices.cjs

      - name: Build real school, academy and wholesale 10+ quote acquisition
        run: |
          node scripts/build-b2b-quote-planner.cjs
          node scripts/test-b2b-quote-planner.cjs

      - name: Build original buyer product answers and share previews
        run: |
          node scripts/build-product-buyer-answers.cjs
          node scripts/test-product-buyer-answers.cjs

      - name: Build 16 genuine creator-to-product shopping links
        run: |
          node scripts/build-creator-to-product.cjs
          node scripts/test-creator-to-product.cjs

      - name: Build priority Google discovery and buyer decision pathways
        run: |
          node scripts/build-search-buyer-paths.cjs
          node scripts/test-search-buyer-paths.cjs

      - name: Build useful free resources for schools, families and teams
        run: |
          node scripts/build-free-exposure-resources.cjs
          node scripts/test-free-exposure-resources.cjs
          node scripts/build-ai-school-logo-buyer-answers.cjs
          node scripts/check-ai-school-logo-buyer-answers.cjs

      - name: Align canonical host and sitemap with live www redirect
        run: python scripts/normalize-canonical-host.py

      - name: Normalize contact helper across generated pages
        run: python scripts/normalize-contact-helper.py

      - name: Add crawlable, contextual links to buying and product pages
        run: |
          node scripts/build-seo-discovery-links.cjs
          node scripts/build-product-listing-discovery.cjs
          node scripts/check-product-listing-discovery.cjs
          node scripts/check-seo-discovery-links.cjs
          node scripts/check-ai-intent-guides.cjs
          node scripts/check-acoustics-citations.cjs
          node scripts/check-school-procurement-evidence.cjs
          node scripts/check-open-trial-kit.cjs
          node scripts/check-localized-school-guides.cjs
          node scripts/test-localized-school-guides.cjs
          node scripts/check-coach-ai-answers.cjs
          node scripts/check-public-crawl-graph.cjs
          node scripts/check-school-product-crawl-paths.cjs
          node scripts/build-school-sample-evaluation.cjs --check
          node scripts/check-shareable-b2b-resources.cjs
          node scripts/check-wholesale-supplier-introduction.cjs
          node scripts/check-b2b-sharing-preview.cjs
          node scripts/check-wholesale-product-deep-links.cjs
          node scripts/check-public-canonicals.cjs
          node scripts/check-sitemap-lastmod-evidence.cjs
          node scripts/check-b2b-acquisition-resource.cjs
          node scripts/check-procurement-ai-buyer-answers.cjs
          node scripts/test-public-canonicals.cjs
          node scripts/check-geo-source-capture.cjs
          node scripts/check-ai-discovery-benchmark.cjs
          node scripts/build-ai-product-facts.cjs
          node scripts/check-ai-product-facts.cjs
          node scripts/build-ai-product-facts.cjs --check
          node scripts/check-wholesale-product-facts-csv.cjs
          node scripts/check-indexnow-key.cjs
          node scripts/test-indexnow-notify-changed.cjs
          python scripts/check-live-public-crawl.py --self-test

      - name: Verify priority catalog, fabric and creator indexing context
        run: |
          node scripts/check-priority-indexing-pages.cjs
          node scripts/test-school-buyer-rfq.cjs

      - name: Optimize first-party native image loading
        run: |
          node scripts/optimize-native-media.cjs
          node scripts/check-native-media.cjs

      - name: Enforce first-party static asset size regression budgets
        run: |
          node scripts/check-performance-budget.cjs
          node scripts/test-performance-budget.cjs

      - name: Keep product-specific direct quote links in built catalog
        run: |
          node scripts/build-product-direct-rfq.cjs
          node scripts/check-product-direct-rfq.cjs

      - name: Use verified MING EAGLE brand logo in public metadata
        run: |
          node scripts/build-brand-metadata.cjs
          node scripts/check-brand-metadata.cjs
          node scripts/build-brand-metadata.cjs --check

      - name: Capture AI / search first-visit sources on public buyer pages only
        run: |
          node scripts/build-first-touch-crawl-coverage.cjs
          node scripts/check-first-touch-crawl-coverage.cjs
          node scripts/build-first-touch-crawl-coverage.cjs --check

      - name: Enable privacy-focused Cloudflare Web Analytics across built HTML
        run: |
          node scripts/enable-web-analytics.cjs
          node scripts/check-web-analytics.cjs
          node scripts/enable-web-analytics.cjs --check

      - name: Enable opt-in Google Analytics 4 with sanitized page URLs
        run: |
          node scripts/enable-ga4-consent.cjs
          node scripts/check-ga4-consent.cjs
          node scripts/test-ga4-consent-flow.cjs
          node scripts/check-homepage-layout.cjs
          node scripts/enable-ga4-consent.cjs --check

      - name: Verify canonical B2B header navigation across public pages
        run: node scripts/check-site-navigation.cjs

      - name: Verify school and institutional buyer RFQ outreach paths
        run: node scripts/test-b2b-outreach-pages.cjs

      - name: Verify confirmation build
        run: |
          test -f public/index.html
          test -f public/products.html
          test -f public/product-master.json
          test -f public/product-grid-2x2.css
          test -f public/assets/hero-flocked-silent-basketball-set.webp
          test -f public/assets/hero-fabric-cover-silent-basketball-set.webp
          test -f public/assets/hero-weighted-flocked-silent-basketball.webp
          test -f public/assets/hero-flocked-silent-soccer-ball.webp
          grep -q "productGrid2" public/index.html
          grep -q "productGrid2" public/products.html
          grep -q "Orange / Blue / Green / Yellow" public/product-master.json
          grep -q "No. 3 / No. 4 / No. 6 / No. 7" public/product-master.json
          grep -q "Orange / Brown / Black / Aqua Blue" public/product-master.json
          grep -q "Black/Red" public/product-master.json
          grep -q "Yellow/Green" public/product-master.json
          if grep -RniE "floot\\.app|ming-eagle-sports\\.floot" public; then
            echo "Floot runtime dependency detected"
            exit 1
          fi

      - name: Reverify qualified institutional lead conversion after all site builders
        run: node scripts/test-b2b-quote-planner.cjs

      - name: Verify inbound attribution and translations
        run: node scripts/check-growth.cjs && node scripts/check-learning.cjs && node scripts/check-marketing-kit.cjs && node scripts/check-conversion.cjs && node scripts/check-crm-bridge.cjs && node scripts/check-turnstile.cjs && node scripts/check-seo-v37.cjs && node scripts/check-catalog-inquiry.cjs && node scripts/check-inquiry.cjs

      - name: Verify CRM payload source attribution
        run: node scripts/check-forms-core.cjs

      - name: Enforce retail 1–9 vs 10+ sea wholesale routing and browser script safety
        run: |
          node scripts/check-retail-quantity-routing.cjs
          node scripts/test-product-cart-journey.cjs

      - name: Verify shipping quote calculator
        run: node scripts/check-shipping.cjs

      - name: Verify retail-to-wholesale quote calculations
        run: node scripts/check-quote-math.cjs

      - name: Verify shared retail prices are packaged for deployment
        run: |
          test -s public/retail-reference-prices.json
          test -s public/quote-math.js
          node -e "const p=require('./public/retail-reference-prices.json'); if(p.currency!=='USD'||Object.keys(p.products||{}).length!==4)process.exit(1)"

      - name: Verify nine-language sales assistant before publishing
        run: |
          node --check public/sales-assistant.js
          node --check public/sales-assistant-i18n.js
          node scripts/check-chat-i18n.cjs
          node scripts/check-locale-completeness.cjs

      - name: Verify priority buyer guide SEO metadata and structured data
        run: node scripts/check-priority-seo-guides.cjs

      - name: Preserve Bing Webmaster Tools verification on final generated homepage
        run: |
          node scripts/ensure-bing-webmaster-verification.cjs
          node scripts/ensure-bing-webmaster-verification.cjs --check

      - name: Stamp publicly verifiable deployment revision
        run: |
          printf '{"revision":"%s","builtAt":"%s","workflow":"github-pages"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deployment-version.json
          test -s public/deployment-version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm live site serves this exact revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://www.mingeagle.com/deployment-version.json'
          expected = os.environ['EXPECTED_REVISION']
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent':'MING-EAGLE-deploy-check/1.0'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      data = json.load(response)
                  if data.get('revision') == expected:
                      print('PASS: public website serves deployed revision', expected)
                      break
                  print('Still serving', data.get('revision'), 'expected', expected)
              except Exception as exc:
                  print('Waiting for live deployment:', str(exc))
              if attempt == 11:
                  raise SystemExit('FAIL: public site did not serve deployed revision')
              time.sleep(10)
          PY

      - name: Verify Bing site ownership tag on live canonical homepage
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.mingeagle.com/'
          request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-Bing-ownership-check/1.0'})
          with urllib.request.urlopen(request,timeout=20) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise SystemExit('FAIL: Bing verification homepage does not return canonical HTTP 200')
              html=response.read().decode('utf-8')
          head=re.split(r'</head>',html,1,flags=re.I)[0]
          tag='<meta name="msvalidate.01" content="B90BA0E0B26B927BA506ED085EE0C32F" />'
          if head.count(tag)!=1 or len(re.findall(r'name=["\x27]msvalidate[.]01["\x27]',head,re.I))!=1:
              raise SystemExit('FAIL: Bing ownership proof missing, duplicated or wrong')
          print('PASS: live www homepage contains exact Bing Webmaster verification token once')
          PY

      - name: Verify real HTTPS school buying guides in four additional languages
        run: |
          python - <<'PY'
          import json, re, urllib.request
          base='https://www.mingeagle.com/'
          versions={
            'en':'indoor-school-sports-equipment-guide.html',
            'de':'school-sports-equipment-de.html',
            'fr':'school-sports-equipment-fr.html',
            'es':'school-sports-equipment-es.html',
            'pt':'school-sports-equipment-pt.html'
          }
          common=dict(versions)
          common['x-default']=versions['en']
          for lang,filename in versions.items():
              url=base+filename
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-hreflang-live-check/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise SystemExit('FAIL translated guide HTTP: '+url)
                  html=response.read().decode('utf-8')
              head=html.split('</head>')[0]
              if '<html lang="'+lang+'">' not in html or '<link rel="canonical" href="'+url+'">' not in head:
                  raise SystemExit('FAIL wrong language or self canonical: '+url)
              for code,page in common.items():
                  expected='<link rel="alternate" hreflang="'+code+'" href="'+base+page+'">'
                  if head.count(expected)!=1:
                      raise SystemExit('FAIL missing reciprocal hreflang '+code+' on '+url)
              if html.count('<h1>')!=1:
                  raise SystemExit('FAIL missing native page title '+url)
              print('PASS live localized school buying guide, self canonical and six reciprocal alternates',lang,url)
          for doc,tag in [('robots.txt','sitemap-localized.xml'),('sitemap-localized.xml','school-sports-equipment-pt.html')]:
              with urllib.request.urlopen(urllib.request.Request(base+doc,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  text=response.read().decode('utf-8')
                  if response.status!=200 or tag not in text:
                      raise SystemExit('FAIL local-language sitemap advertised/available '+doc)
              print('PASS live multilingual sitemap discovery',doc)
          PY

      - name: Verify live AI scenario guides and search-crawler discovery
        run: |
          python - <<'PY'
          import urllib.request
          base='https://www.mingeagle.com/'
          for filename in ('quiet-indoor-sports-for-kids.html','indoor-school-sports-equipment-guide.html'):
              url=base+filename
              req=urllib.request.Request(url,headers={'User-Agent':'MING-EAGLE-ai-discovery-verify/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  html=response.read().decode('utf-8')
                  assert response.status==200
                  assert '<link rel="canonical" href="'+url+'">' in html
                  assert '<script type="application/ld+json">' in html
                  assert '<h1>' in html
                  print('PASS live AI scenario guide',url)
          for filename,expected in (('robots.txt','OAI-SearchBot'),('sitemap.xml','quiet-indoor-sports-for-kids.html')):
              with urllib.request.urlopen(urllib.request.Request(base+filename,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                  text=response.read().decode('utf-8')
                  assert response.status==200 and expected in text
                  print('PASS live AI discovery resource',filename)
          PY

      - name: Confirm publicly served AI product facts match this exact approved build
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          base='https://www.mingeagle.com/'
          root=pathlib.Path('public')
          for filename in ('llms.txt','ai-product-facts.json'):
              request=urllib.request.Request(
                  base+filename,
                  headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-ai-facts-verify/1.0'}
              )
              with urllib.request.urlopen(request,timeout=20) as response:
                  body=response.read()
                  if response.status!=200 or not body:
                      raise SystemExit('FAIL AI facts HTTP status/body for '+filename)
              expected=(root/filename).read_bytes()
              if body!=expected:
                  raise SystemExit('FAIL AI facts live CDN body differs from approved published catalog '+filename)
              print('PASS public AI source exact bytes',filename,len(body))
          facts=json.loads((root/'ai-product-facts.json').read_text())
          assert facts['documentType']=='first-party-public-product-facts'
          assert len(facts['products'])==4 and len(facts['guides'])==12
          assert facts['publisher']['website']==base
          assert 'llms.txt' not in [x['url'] for x in facts['products']]
          print('PASS verified live AI product data remains first-party, canonical and complete')
          PY

      - name: Verify live product collection ItemList and readable SKU comparisons
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url='https://www.mingeagle.com/products.html'
          request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-catalog-discovery-check/1.0'})
          with urllib.request.urlopen(request,timeout=20) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise SystemExit('FAIL public catalog HTML is inaccessible')
              html=response.read().decode('utf-8')
          start='<!-- MING EAGLE PRODUCT COLLECTION SCHEMA START -->'
          end='<!-- MING EAGLE PRODUCT COLLECTION SCHEMA END -->'
          if html.count(start)!=1 or html.count(end)!=1:
              raise SystemExit('FAIL missing unique public ItemList block')
          raw=html.split(start)[1].split(end)[0]
          m=re.search(r'<script type="application/ld[+]json">(.*?)</script>',raw,re.S)
          if m is None:
              raise SystemExit('FAIL missing ItemList JSON-LD script')
          data=json.loads(m.group(1))
          if data.get('@type')!='ItemList' or data.get('numberOfItems')!=4:
              raise SystemExit('FAIL inaccurate public product listing schema')
          items=data.get('itemListElement',[])
          expected=('silent-basketball.html','fabric-silent-basketball.html','weighted-flocked-basketball.html','silent-soccer.html')
          if len(items)!=4:
              raise SystemExit('FAIL unexpected product collection count')
          table=html.split('<section class="section comparisonSection" id="compare">')[1].split('</section>')[0]
          for i,(sku,page) in enumerate(zip(items,expected),start=1):
              product=sku.get('item',{})
              if sku.get('position')!=i or product.get('url')!='https://www.mingeagle.com/'+page:
                  raise SystemExit('FAIL mismatched product collection URL '+page)
              if '<a href="'+page+'">'+product.get('name','')+'</a>' not in table:
                  raise SystemExit('FAIL missing matching readable comparison link '+page)
              print('PASS live product comparison + ItemList',page)
          PY

      - name: Confirm public indexed catalog links to all four product pages
        run: |
          python - <<'PY'
          import pathlib, re, urllib.request
          url='https://www.mingeagle.com/wholesale-product-catalog.html'
          request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-product-discovery-check/1.0'})
          with urllib.request.urlopen(request,timeout=20) as response:
              if response.status!=200:
                  raise SystemExit('FAIL indexed product catalog HTTP status')
              source=response.read().decode('utf-8')
          local=pathlib.Path('public/wholesale-product-catalog.html').read_text()
          links=('silent-basketball.html','fabric-silent-basketball.html','weighted-flocked-basketball.html','silent-soccer.html')
          for page in links:
              marker='href="'+page+'"'
              if marker not in source or marker not in local:
                  raise SystemExit('FAIL missing static detail product link '+page)
              print('PASS live wholesale-to-product static link',page)
              detail_url='https://www.mingeagle.com/'+page
              detail_request=urllib.request.Request(detail_url,headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-product-discovery-check/1.0'})
              with urllib.request.urlopen(detail_request,timeout=20) as response:
                  if response.status!=200 or response.geturl()!=detail_url:
                      raise SystemExit('FAIL product detail HTTP/redirect '+detail_url)
                  detail=response.read().decode('utf-8')
              if 'href="'+detail_url+'"' not in detail.split('</head>')[0]:
                  raise SystemExit('FAIL product canonical '+detail_url)
              if 'application/ld+json' not in detail.split('</head>')[0] or '"@type":"ProductGroup"' not in detail:
                  raise SystemExit('FAIL product structured data '+detail_url)
              print('PASS live product page HTTP200, canonical and ProductGroup schema',page)
          PY

      - name: Verify live canonical host and key AI buyer pages
        run: |
          python - <<'PY'
          import re, urllib.request
          root='https://www.mingeagle.com/'
          pages=[
            '', 'silent-basketball.html', 'wholesale.html',
            'wholesale-product-catalog.html', 'for-schools.html',
            'for-coaches.html', 'quiet-indoor-sports-for-kids.html',
            'indoor-school-sports-equipment-guide.html'
          ]
          for page in pages:
              url=root+page
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MING-EAGLE-canonical-verify/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise SystemExit('FAIL live canonical HTTP status/redirect '+url)
                  html=response.read().decode('utf-8')
              head=html.split('</head>')[0]
              canonical=re.findall(r'<link\b[^>]*rel=["\x27]canonical["\x27][^>]*>',head,re.I)
              if len(canonical)!=1 or ('href="'+url+'"') not in canonical[0]:
                  raise SystemExit('FAIL live canonical mismatch '+url)
              if 'https://mingeagle.com/' in head:
                  raise SystemExit('FAIL live SEO head contains apex URL '+url)
              print('PASS live exact canonical host',url)
          PY

      - name: Verify live model comparison and creator discovery from an ordinary HTTP crawler
        run: |
          python - <<'PY'
          import urllib.request
          root='https://www.mingeagle.com/'
          pages={
            'index.html':('id="real-indoor-product-demos"','href="videos.html"','href="fabric-silent-basketball.html"'),
            'silent-basketball.html':('id="flocked-or-fabric-comparison"','href="fabric-silent-basketball.html"','href="videos.html"'),
            'fabric-silent-basketball.html':('id="fabric-vs-flocked-set"','Compact adhesive mini hoop','href="silent-basketball.html"'),
            'products.html':('id="indoor-ball-selection-guide"','href="fabric-silent-basketball.html"','href="videos.html"'),
            'videos.html':('id="creator-video-buying-advice"','href="silent-basketball.html"','og:image')
          }
          for page,required in pages.items():
              req=urllib.request.Request(root+page,headers={
                'Cache-Control':'no-cache',
                'User-Agent':'MING-EAGLE-search-paths-live-verify/1.0'
              })
              with urllib.request.urlopen(req,timeout=25) as resp:
                  if resp.status!=200 or resp.geturl()!=root+page:
                      raise SystemExit('FAIL live HTML status/redirect '+page)
                  html=resp.read().decode('utf-8')
              for needle in required:
                  if needle not in html:
                      raise SystemExit('FAIL live editorial discovery '+page+' missing '+needle)
              if 'MING EAGLE SEARCH BUYER PATHS BEGIN' not in html:
                  raise SystemExit('FAIL buyer content removed by later build '+page)
              if page=='videos.html' and '"@type":"VideoObject"' in html:
                  raise SystemExit('FAIL unsupported video rich-result claims')
              print('PASS real served buyer pathways',page)
          PY

      - name: Verify live pricing JSON and calculator HTTP responses
        run: |
          python - <<'PY'
          import json, urllib.request
          base = 'https://www.mingeagle.com/'
          for filename in ('retail-reference-prices.json', 'quote-math.js'):
              with urllib.request.urlopen(urllib.request.Request(base+filename,headers={'Accept':'application/json' if filename.endswith('.json') else '*/*','User-Agent':'MING-EAGLE-verify/1.0'}), timeout=20) as response:
                  body=response.read()
                  if response.status!=200 or not body:
                      raise SystemExit('FAIL '+filename+' status '+str(response.status))
                  print('PASS live resource', filename, 'bytes', len(body), 'type', response.headers.get('Content-Type'))
                  if filename.endswith('.json'):
                      data=json.loads(body)
                      assert data['currency']=='USD' and len(data['products'])==4
                  else:
                      assert b'calculateFromCatalog' in body
          PY

      - name: Audit live GA4 consent assets without sending analytics events
        run: node scripts/verify-live-ga4-consent.mjs

      - name: Audit all 31 live public sitemap URLs after deployment
        run: python scripts/check-live-public-crawl.py

      - name: Preserve 31-page HTTP crawl and synthetic UA diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-public-crawl-audit
          path: public-crawl-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify IndexNow only after live 31-page audit passes
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true  # Search-engine outage must not undo a verified website deployment
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow-notify-changed.cjs

      - name: Preserve IndexNow receipt / skip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-changed-url-notification
          path: indexnow-deployment-evidence.json
          if-no-files-found: ignore
          retention-days: 14
