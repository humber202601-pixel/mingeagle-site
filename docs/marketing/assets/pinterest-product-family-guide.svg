<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><style>text{font-family:DejaVu Sans,sans-serif}.brand{font-size:38px;font-weight:800;fill:#ff6b28}.title{font-size:65px;font-weight:800;fill:#122339}.sub{font-size:23px;fill:#526273}.num{font-size:42px;font-weight:800;fill:#f56624}.cardtitle{font-size:26px;font-weight:800;fill:#122339}.body{font-size:21px;fill:#445567}</style><rect width="1000" height="1500" fill="#f0f4f7" /><rect width="1000" height="12" fill="#ff6b28" /><text x="60" y="88" class="brand">MING EAGLE</text><text x="60" y="145" class="sub">MORE PLAY. EVERY DAY.</text><text x="60" y="240" class="title">FOUR INDOOR</text><text x="60" y="317" class="title">BALL FAMILIES</text><text x="60" y="394" class="title">TO COMPARE</text><text x="60" y="440" class="sub">Choose by the intended activity, then evaluate samples</text><rect x="60" y="482" width="880" height="115" rx="18" fill="white" /><text x="85" y="550" class="num">01</text><text x="170" y="524" class="cardtitle">FLOCKED BASKETBALL SET</text><text x="170" y="561" class="body">Soft flocked ball with an adhesive indoor mini hoop.</text><rect x="60" y="617" width="880" height="115" rx="18" fill="white" /><text x="85" y="685" class="num">02</text><text x="170" y="659" class="cardtitle">FABRIC-COVER SET</text><text x="170" y="696" class="body">A fabric-cover basketball set with a mini hoop.</text><rect x="60" y="752" width="880" height="115" rx="18" fill="white" /><text x="85" y="820" class="num">03</text><text x="170" y="794" class="cardtitle">WEIGHTED FLOCKED BALL</text><text x="170" y="831" class="body">Check the model weight and intended training activity.</text><rect x="60" y="887" width="880" height="115" rx="18" fill="white" /><text x="85" y="955" class="num">04</text><text x="170" y="929" class="cardtitle">FLOCKED SOCCER BALL</text><text x="170" y="966" class="body">An indoor soccer-ball option for controlled activities.</text><rect x="60" y="1022" width="88