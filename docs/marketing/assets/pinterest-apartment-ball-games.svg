<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><style>text{font-family:DejaVu Sans,sans-serif}.brand{font-size:38px;font-weight:800;fill:#ff6b28}.title{font-size:65px;font-weight:800;fill:#122339}.sub{font-size:23px;fill:#526273}.num{font-size:42px;font-weight:800;fill:#f56624}.cardtitle{font-size:26px;font-weight:800;fill:#122339}.body{font-size:21px;fill:#445567}</style><rect width="1000" height="1500" fill="#f0f4f7" /><rect width="1000" height="12" fill="#ff6b28" /><text x="60" y="88" class="brand">MING EAGLE</text><text x="60" y="145" class="sub">MORE PLAY. EVERY DAY.</text><text x="60" y="240" class="title">FIVE BALL GAMES</text><text x="60" y="317" class="title">WITHOUT FLOOR</text><text x="60" y="394" class="title">BOUNCING</text><text x="60" y="440" class="sub">Short, controlled activities for agreed indoor play hours</text><rect x="60" y="482" width="880" height="115" rx="18" fill="white" /><text x="85" y="550" class="num">01</text><text x="170" y="524" class="cardtitle">SEATED HANDOVERS</text><text x="170" y="561" class="body">Sit facing a partner. Hand the ball across slowly.</text><rect x="60" y="617" width="880" height="115" rx="18" fill="white" /><text x="85" y="685" class="num">02</text><text x="170" y="659" class="cardtitle">AROUND THE WAIST</text><text x="170" y="696" class="body">Circle a held ball around the waist. Change direction.</text><rect x="60" y="752" width="880" height="115" rx="18" fill="white" /><text x="85" y="820" class="num">03</text><text x="170" y="794" class="cardtitle">MIRROR MOVES</text><text x="170" y="831" class="body">Copy a partner’s slow held-ball movements.</text><rect x="60" y="887" width="880" height="115" rx="18" fill="white" /><text x="85" y="955" class="num">04</text><text x="170" y="929" class="cardtitle">STEP &amp; FREEZE</text><text x="170" y="966" class="body">Carry for three small steps, then stop on a signal.</text><rect x="60" y="1022" width="880" height="115" rx="18" fill="white" /><text x="85" y="1090" class="num">05</text><text x="170" y="1064" class="cardtitle">GENTLE TARGET ROLLS</text><text x="170" y="1101" class="body">Only if suitable. Skip rolling if sound carries.</text><text x="60" y="1200" style="font-size:20px;fill:#526273">Soft balls and mats do not remove building vibration.</text><rect x="60" y="1250" width="880" height="185" rx="22" fill="#122339" /><text x="90" y="1301" style="font-size:24px;font-weight:800;fill:#ff995f">FREE INDOOR ACTIVITY IDEAS</text><text x="90" y="1355" style="font-size:36px;font-weight:800;fill:white">mingeagle.com</text><text x="90" y="1398" style="font-size:23px;fill:#d5dee7">Adapt to your space. Pause if others are disturbed.</text></svg>