<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><style>text{font-family:DejaVu Sans,sans-serif}.brand{font-size:38px;font-weight:800;fill:#ff6b28}.title{font-size:65px;font-weight:800;fill:#122339}.sub{font-size:23px;fill:#526273}.num{font-size:42px;font-weight:800;fill:#f56624}.cardtitle{font-size:26px;font-weight:800;fill:#122339}.body{font-size:21px;fill:#445567}</style><rect width="1000" height="1500" fill="#f0f4f7"/><rect width="1000" height="12" fill="#ff6b28"/><text x="60" y="88" class="brand">MING EAGLE</text><text x="60" y="145" class="sub">MORE PLAY. EVERY DAY.</text><text x="60" y="240" class="title">TEAM LOGO</text><text x="60" y="317" class="title">BASKETBALL</text><text x="60" y="394" class="title" style="font-size:56px">QUOTE CHECKLIST</text><text x="60" y="440" class="sub">Prepare a clearer brief before requesting customization</text><rect x="60" y="482" width="880" height="115" rx="18" fill="white"/><text x="85" y="550" class="num">01</text><text x="170" y="524" class="cardtitle">MODEL &amp; SIZE</text><text x="170" y="561" class="body">Choose the product family and ball size.</text><rect x="60" y="617" width="880" height="115" rx="18" fill="white"/><text x="85" y="685" class="num">02</text><text x="170" y="659" class="cardtitle">AUTHORIZED ARTWORK</text><text x="170" y="696" class="body">Use a logo you own or have permission to print.</text><rect x="60" y="752" width="880" height="115" rx="18" fill="white"/><text x="85" y="820" class="num">03</text><text x="170" y="794" class="cardtitle">QUANTITY &amp; DESTINATION</text><text x="170" y="831" class="body">State the number of units and delivery location.</text><rect x="60" y="887" width="880" height="115" rx="18" fill="white"/><text x="85" y="955" class="num">04</text><text x="170" y="929" class="cardtitle">SAMPLE APPROVAL</text><text x="170" y="966" class="body">Confirm artwork, placement and a sample if needed.</text><rect x="60" y="1022" width="880" height="115" rx="18" fill="white"/><text x="85" y="1090" class="num">05</text><text x="170" y="1064" class="cardtitle">WRITTEN QUOTE</text><text x="170" y="1101" class="body">Confirm customization, freight and dispatch terms.</text><text x="60" y="1200" style="font-size:20px;fill:#526273">A digital preview is a planning aid, not a printed sample.</text><rect x="60" y="1250" width="880" height="185" rx="22" fill="#122339"/><text x="90" y="1301" style="font-size:24px;font-weight:800;fill:#ff995f">FREE COPY-READY CHECKLIST</text><text x="90" y="1355" style="font-size:36px;font-weight:800;fill:white">mingeagle.com</text><text x="90" y="1398" style="font-size:23px;fill:#d5dee7">For clubs, academies, schools &amp; resellers</text></svg>