<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><style>text{font-family:DejaVu Sans,sans-serif}.brand{font-size:38px;font-weight:800;fill:#ff6b28}.title{font-size:65px;font-weight:800;fill:#122339}.sub{font-size:23px;fill:#526273}.num{font-size:42px;font-weight:800;fill:#f56624}.cardtitle{font-size:26px;font-weight:800;fill:#122339}.body{font-size:21px;fill:#445567}</style><rect width="1000" height="1500" fill="#f0f4f7"/><rect width="1000" height="12" fill="#ff6b28"/><text x="60" y="88" class="brand">MING EAGLE</text><text x="60" y="145" class="sub">MORE PLAY. EVERY DAY.</text><text x="60" y="240" class="title">10-MINUTE</text><text x="60" y="317" class="title">NO-BOUNCE</text><text x="60" y="394" class="title">BALL SESSION</text><text x="60" y="440" class="sub">A simple activity plan for small supervised PE groups</text><rect x="60" y="482" width="880" height="115" rx="18" fill="white"/><text x="85" y="550" class="num">01</text><text x="170" y="524" class="cardtitle">SET THE SPACE</text><text x="170" y="561" class="body">Clear the activity zone. Agree on a stop signal.</text><rect x="60" y="617" width="880" height="115" rx="18" fill="white"/><text x="85" y="685" class="num">02</text><text x="170" y="659" class="cardtitle">MIRROR THE LEADER</text><text x="170" y="696" class="body">Move a held ball slowly. Partners mirror and switch.</text><rect x="60" y="752" width="880" height="115" rx="18" fill="white"/><text x="85" y="820" class="num">03</text><text x="170" y="794" class="cardtitle">CAREFUL HANDOVERS</text><text x="170" y="831" class="body">Pass hand to hand around a circle. No throwing.</text><rect x="60" y="887" width="880" height="115" rx="18" fill="white"/><text x="85" y="955" class="num">04</text><text x="170" y="929" class="cardtitle">STEP &amp; FREEZE</text><text x="170" y="966" class="body">Carry for three small steps. Freeze on the signal.</text><rect x="60" y="1022" width="880" height="115" rx="18" fill="white"/><text x="85" y="1090" class="num">05</text><text x="170" y="1064" class="cardtitle">REVIEW &amp; RESET</text><text x="170" y="1101" class="body">Discuss control and noise. Collect the equipment.</text><text x="60" y="1200" style="font-size:20px;fill:#526273">2 minutes per step. Adapt to pupils, space and supervision.</text><rect x="60" y="1250" width="880" height="185" rx="22" fill="#122339"/><text x="90" y="1301" style="font-size:24px;font-weight:800;fill:#ff995f">FREE ACTIVITY SHEET</text><text x="90" y="1355" style="font-size:36px;font-weight:800;fill:white">mingeagle.com</text><text x="90" y="1398" style="font-size:23px;fill:#d5dee7">School equipment trials &amp; bulk inquiries</text></svg>