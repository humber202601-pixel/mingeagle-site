name = "mingeagle-v2"
compatibility_date = "2026-10-04"
pages_build_output_dir = "./dist"

[vars]
RETAIL_STOCK_FULFILLMENT_APPROVED = "true"
TURNSTILE_SITE_KEY = "0x4AAAAAAFU4fZe_EszmlRsc"
TURNSTILE_ENABLED = "true"
# Controlled live wholesale launch: all 50 US states + DC are eligible
# only when the seller has issued and the buyer has accepted a quote with
# an explicitly reviewed sales-tax amount and tax basis, complete US ship-to,
# exact quoted destination, and Stripe payment terms. This flag is NOT a
# tax registration and does not create nexus, exemption or filing rights.
STRIPE_RETAIL_ONLY_ENABLED = "false"
STRIPE_B2B_CHECKOUT_ENABLED = "true"
STRIPE_B2B_TAX_POLICY_APPROVED = "true"
STRIPE_B2B_APPROVED_US_STATES = "AL,AK,AZ,AR,CA,CO,CT,DE,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY,DC"
STRIPE_TAX_POLICY_APPROVED = "true"
RETAIL_TAX_POLICY_APPROVED = "true"
RETAIL_US_TAX_POLICY_JSON = '{"reviewed_on":"2026-10-14","review_reference":"OFFICIAL_OR_NH_GENERAL_SALES_USE_TAX_20261014","basis":"NO_GENERAL_SALES_USE_TAX","states":{"OR":"NO_COLLECTION_REQUIRED","NH":"NO_COLLECTION_REQUIRED"}}'
RETAIL_CHECKOUT_ENABLED = "true"
# Merchant operating facts are held only in encrypted deployment bindings.
# Do not declare a plaintext variable with the same name as that secret.

[[d1_databases]]
binding = "MINGEAGLE_DB"
database_name = "mingeagle-v2"
database_id = "8dfddbe8-f4ff-4f5e-bb5d-063ec3933814"
preview_database_id = "ecd66556-ea9b-492f-99df-079c3db24221"

[env.preview.vars]
TEST_ENVIRONMENT = "preview"
OUTBOUND_EMAIL_DISABLED = "true"
AUTO_EMAIL_ENABLED = "false"
STRIPE_MODE = "test"
STRIPE_SANDBOX_ENABLED = "true"
STRIPE_ACCEPTANCE_ENABLED = "false"

[[env.preview.d1_databases]]
binding = "MINGEAGLE_DB"
database_name = "mingeagle-crm-preview"
database_id = "ecd66556-ea9b-492f-99df-079c3db24221"
